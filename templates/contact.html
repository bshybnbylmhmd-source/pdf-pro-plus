<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا - PDF Pro+</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f8f9fa; color: #333; line-height: 1.8; }
        .container { max-width: 700px; background: #fff; padding: 40px; margin-top: 50px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #0d6efd; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">اتصل بنا</h1>
        <p>نحن نحرص دائماً على سماع آرائكم، استفساراتكم، أو أي ملاحظات حول خدمات موقع <strong>PDF Pro+</strong>.</p>
        
        <div class="alert alert-info mt-4">
            <h5>طرق التواصل المباشر مع إدارة الموقع (صهيب):</h5>
            <p class="mb-0">يمكنكم مراسلتنا في أي وقت عبر البريد الإلكتروني الخاص بالموقع أو عبر وسائل التواصل الخاصة بالدعم الفني.</p>
        </div>

        <form class="mt-4">
            <div class="mb-3">
                <label for="name" class="form-label">الاسم الكريم</label>
                <input type="text" class="form-control" id="name" placeholder="أدخل اسمك هنا">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">البريد الإلكتروني</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com">
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">رسالتك</label>
                <textarea class="form-control" id="message" rows="4" placeholder="اكتب استفسارك أو مشكلتك هنا..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">إرسال الرسالة</button>
        </form>

        <div class="mt-4">
            <a href="/" class="btn btn-secondary">العودة للرئيسية</a>
        </div>
    </div>
</body>
</html>
